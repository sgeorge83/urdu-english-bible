# One-time workflow: generates the Android signing keystore, encrypts it with
# your KEYSTORE_PASSWORD secret, and commits the ENCRYPTED copy to the repo.
# The plaintext keystore never leaves the runner and is never printed.
#
# Before running, add two repository secrets (Settings > Secrets and variables
# > Actions > New repository secret):
#   KEYSTORE_PASSWORD  - a long password you choose (also used to encrypt the file)
#   KEY_PASSWORD       - a second password for the signing key itself
# Write both passwords down somewhere safe (password manager / private note).
#
# After the run, open the workflow summary to copy the SHA-256 fingerprint
# into .well-known/assetlinks.json.

name: Android - Generate signing keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to overwrite an existing keystore
        run: |
          if [ -f android/android.keystore.gpg ]; then
            echo "::error::android/android.keystore.gpg already exists. Delete it manually first if you REALLY intend to replace the signing key."
            exit 1
          fi

      - name: Check secrets are configured
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add KEYSTORE_PASSWORD and KEY_PASSWORD repository secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=WordOnAir Labs, O=WordOnAir Labs"

      - name: Write SHA-256 fingerprint to summary
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:" | sed 's/.*SHA256: //')
          {
            echo "## Upload key SHA-256 fingerprint"
            echo ""
            echo '```'
            echo "$FP"
            echo '```'
            echo ""
            echo "Paste this value into \`.well-known/assetlinks.json\` (replacing the UPLOAD_KEY placeholder)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt keystore and commit it to the repo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android
          gpg --batch --symmetric --cipher-algo AES256 \
            --passphrase "$KEYSTORE_PASSWORD" \
            --output android/android.keystore.gpg \
            android.keystore
          rm android.keystore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/android.keystore.gpg
          git commit -m "Add encrypted Android signing keystore"
          git push
